<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FL Real Estate Exam - Adaptive Study Platform with Spaced Repetition, Gamification & AI" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Google Fonts: Outfit (display) + DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    
    <title>FL Real Estate Exam | Study Smart, Pass First Time</title>
    
    <style>
      /* Critical CSS for fast loading */
      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        background: #0f172a;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
      /* Loading spinner */
      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        z-index: 9999;
      }
      .loader-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .loader-logo {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #eab308 0%, #f59e0b 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
        color: #0f172a;
      }
      .loader-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 1.5rem;
        color: #f8fafc;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(234, 179, 8, 0.2);
        border-top-color: #eab308;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="loader-brand">
          <div class="loader-logo">FL</div>
          <span class="loader-text">Real Estate Exam</span>
        </div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
